name: Build hero image assets

on:
  push:
    paths:
      - ".hero-source/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild high resolution hero images
        run: |
          mkdir -p public
          cat .hero-source/dark.part* | tr -d '\n' | base64 -d > public/hero-dark.webp
          cat .hero-source/light.part* | tr -d '\n' | base64 -d > public/hero-light.webp
          rm -rf .hero-source
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add high resolution hero portraits" || exit 0
          git push
